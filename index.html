<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebCraft Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --white: #FAF7F2;
    --maroon: #7A1F2B;
    --ink: #17130F;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
  }
  .split{
    position: fixed;
    inset: 0;
    display: flex;
  }
  .half{
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: flex 0.4s cubic-bezier(0.65,0,0.35,1);
    overflow: hidden;
  }
  .split:has(.half:hover) .half:not(:hover){ flex: 0.8; }
  .split:has(.half:hover) .half:hover{ flex: 1.2; }

  .half-white{ background: var(--white); color: var(--ink); }
  .half-maroon{ background: var(--maroon); color: var(--white); }

  .center-vs{
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    color: var(--white);
    background: var(--ink);
    border-radius: 50%;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }

  :focus-visible{ outline: 2px solid var(--ink); outline-offset: -6px; }

  @media (max-width: 640px){
    .split{ flex-direction: column; }
  }

  @media (prefers-reduced-motion: reduce){
    .half{ transition: none; }
  }
</style>
</head>
<body>

  <div class="split">
    <a class="half half-white" href="site-genz.html" aria-label="Gen Z"></a>
    <a class="half half-maroon" href="webcraft-solutions.html" aria-label="WebCraft Solutions"></a>
  </div>
  <div class="center-vs" aria-hidden="true">VS</div>

</body>
</html>
